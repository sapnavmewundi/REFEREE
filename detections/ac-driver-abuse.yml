title: Anti-Cheat Driver Service Registration Outside Game Install
id: ref-001
status: experimental
description: >
  Detects when a known anti-cheat kernel driver service is created or modified
  outside a standard game installation path. May indicate driver being staged
  for abuse rather than legitimate game use.
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 7045
    ServiceName|contains:
      - 'vgk'
      - 'vgc'
      - 'EasyAntiCheat'
      - 'BEDaisy'
      - 'mhyprot'
      - 'xhunter1'
      - 'faceit'
  filter_install:
    ImagePath|contains:
      - 'Program Files'
      - 'Steam'
      - 'Epic Games'
      - 'Riot Games'
  condition: selection and not filter_install
level: high
tags:
  - attack.persistence
  - attack.t1543.003
references:
  - https://loldrivers.io
  - https://github.com/referee-project/referee

---
title: Anti-Cheat Driver Device Handle from Non-Game Process
id: ref-002
status: experimental
description: >
  Detects a process opening a handle to a known anti-cheat driver device object
  when the calling process is not the expected game or launcher binary. This is
  a strong indicator of driver abuse for kernel-level capabilities.
  Requires Object Access auditing enabled (auditpol /set /subcategory:"Kernel Object" /success:enable).
logsource:
  product: windows
  service: security
detection:
  selection_device:
    EventID: 4663
    ObjectName|contains:
      - '\Device\vgk'
      - '\Device\EasyAntiCheat'
      - '\Device\BEDaisy'
      - '\Device\mhyprot'
      - '\Device\XHUNTER'
  filter_legitimate:
    ProcessName|contains:
      - 'RiotClientServices.exe'
      - 'VALORANT.exe'
      - 'EasyAntiCheat_EOS.exe'
      - 'BEService.exe'
  condition: selection_device and not filter_legitimate
level: critical
tags:
  - attack.defense_evasion
  - attack.t1562.001

