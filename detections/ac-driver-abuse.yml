title: Suspicious Kernel Driver Load — Known Anti-Cheat or Abuse-History Driver
id: ref-003
status: experimental
description: >
  Detects Sysmon Event ID 6 for a known anti-cheat or abuse-history kernel
  driver. These drivers provide ring-0 primitives (memory access, callback
  removal, process manipulation) and have documented BYOVD abuse cases.
  A load outside expected game-install context is a precursor to telemetry
  blinding or privilege escalation.
  Note: callback removal itself has no standard Windows event; this rule
  catches the precursor (the driver load). Pair with ref-004 (ETW session
  tampering) for two-stage correlation.
logsource:
  product: windows
  service: sysmon
detection:
  selection_driver_load:
    EventID: 6
    ImageLoaded|endswith:
      - '\vgk.sys'
      - '\EasyAntiCheat.sys'
      - '\BEDaisy.sys'
      - '\mhyprot2.sys'
      - '\mhyprot3.sys'
      - '\xhunter1.sys'
      - '\faceit.sys'
  filter_signed:
    Signed: 'true'
    SignatureStatus: 'Valid'
    ImageLoaded|contains:
      - 'Program Files'
      - 'Riot Games'
      - 'Steam'
      - 'Epic Games'
  condition: selection_driver_load and not filter_signed
level: high
tags:
  - attack.defense_evasion
  - attack.t1562.001
  - attack.t1068
falsepositives:
  - Legitimate game first-time install loading the AC driver
  - Windows Update replacing kernel components

---
title: ETW Trace Session Modified by Non-System Process
id: ref-004
status: experimental
description: >
  Detects a non-SYSTEM process stopping or modifying an ETW trace session
  that is typically controlled by security products. Driver-assisted ETW
  blinding (patching EtwpEventWriteFull or stopping the NT Kernel Logger
  session) is a documented post-exploitation technique. This rule filters
  to security-relevant sessions and excludes SYSTEM-context changes.
logsource:
  product: windows
  service: microsoft-windows-etw-session
detection:
  selection:
    EventID:
      - 12
      - 14
    SessionName|contains:
      - 'NT Kernel Logger'
      - 'Circular Kernel Context Logger'
      - 'Defender'
      - 'SenseIR'
      - 'EventLog-Security'
      - 'DiagTrack'
  filter_system:
    User|contains:
      - 'SYSTEM'
      - 'LOCAL SERVICE'
      - 'NETWORK SERVICE'
  condition: selection and not filter_system
level: high
tags:
  - attack.defense_evasion
  - attack.t1562.006
falsepositives:
  - Admin-initiated diagnostic trace stops
  - GPO-driven ETW configuration changes
